name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  community:
    name: Community modules and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/local-platform.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/function-privileges.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/mineort-community.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/map-trails.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/map-marker-media.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/map-tile-edges.sql
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/community-public.spec.ts e2e/map.spec.ts
        env:
          CI: "true"
          E2E_MAP_FIXTURE: "1"
          FF_P1A: "true"
          FF_P1B: "true"
          FF_P1B_SOCIAL: "true"
          FF_P1B_GUILDS: "true"
          FF_P1C: "true"
          FF_P1C_ATLAS: "true"
          FF_SOCIAL_COMMENTS: "true"
          FF_COMMUNITY_EVENTS: "true"
          FF_COMMUNITY_NOTIFICATIONS: "true"
          FF_COMMUNITY_SMS: "true"
          FF_COMMUNITY_PROGRESS: "true"

  paper:
    name: Paper bridge build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: bash ./gradlew build
        working-directory: plugin
